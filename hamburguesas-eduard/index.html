<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menú · Hamburguesas Eduard</title>
<meta property="og:title" content="Menú · Hamburguesas Eduard">
<meta property="og:description" content="Vea el menú y haga su pedido por WhatsApp">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#FBF6EC;color:#3B2A1A;font-family:'Segoe UI',Roboto,Arial,sans-serif}
  .caja{max-width:640px;margin:0 auto;padding:24px 14px 120px}
  header{text-align:center}
  header img{max-height:110px;max-width:65%;object-fit:contain}
  h1{font-family:Georgia, 'Times New Roman', serif;font-size:30px;margin:8px 0 0}
  .lema{color:#7A6650;font-style:italic;margin:6px 0 0}
  .tel{color:#7A6650;font-size:14px;margin:8px 0 0}
  .controles{position:sticky;top:0;z-index:5;background:#FBF6EC;padding:12px 0 0;margin-top:16px;border-bottom:1px solid #E3D5BE}
  .buscador{width:100%;border:1.5px solid #E3D5BE;border-radius:14px;padding:11px 14px;font:inherit;font-size:16px;background:#FFFFFF;color:#3B2A1A;margin-bottom:10px}
  nav{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav a{flex:none;color:#B5541C;border:1.5px solid #B5541C;border-radius:999px;padding:8px 16px;text-decoration:none;font-weight:700;font-size:14px}
  nav a.activa{background:#B5541C;color:#fff}
  .oculto{display:none !important}
  .vacio{text-align:center;color:#7A6650;padding:30px 10px}
  h2{font-family:Georgia, 'Times New Roman', serif;color:#B5541C;text-transform:uppercase;letter-spacing:.14em;font-size:17px;margin:26px 0 10px;scroll-margin-top:70px}
  .plato{background:#FFFFFF;border:1px solid #E3D5BE;border-radius:16px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
  .info{flex:1;min-width:0}
  .nombre{font-weight:800;font-size:16px}
  .desc{color:#7A6650;font-size:13px;margin-top:2px}
  .precio{color:#B5541C;font-weight:800;margin-top:4px}
  .cant{display:flex;align-items:center;gap:6px}
  .cant button{width:36px;height:36px;border-radius:12px;border:1.5px solid #B5541C;background:transparent;color:#B5541C;font-size:20px;font-weight:800;line-height:1}
  .cant button.mas{background:#B5541C;color:#fff}
  .cant span{min-width:20px;text-align:center;font-weight:800;font-size:17px}
  footer{text-align:center;color:#7A6650;font-size:14px;margin-top:30px}
  .barra{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:#FBF6EC;border-top:1px solid #E3D5BE;display:flex;justify-content:center}
  .barra button,.barra a{flex:1;max-width:420px;border:none;border-radius:16px;padding:15px;font-weight:800;font-size:16px;text-align:center;text-decoration:none}
  .verde{background:#25D366;color:#fff}
  .principal{background:#B5541C;color:#fff}
  .velo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
  .velo.abierto{display:flex}
  .hoja{background:#FBF6EC;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto}
  .hoja h3{margin:0 0 10px;font-family:Georgia, 'Times New Roman', serif;font-size:21px}
  .fila{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:15px}
  .fila.total{border-top:1px solid #E3D5BE;margin-top:6px;padding-top:8px;font-weight:800;font-size:17px}
  label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#7A6650;margin:12px 0 4px}
  input,textarea,select{width:100%;border:1.5px solid #E3D5BE;border-radius:12px;padding:11px;font:inherit;font-size:16px;background:#FFFFFF;color:#3B2A1A}
  textarea{resize:none}
  .opciones{display:flex;gap:8px}
  .opciones button{flex:1;padding:11px;border-radius:12px;border:1.5px solid #B5541C;background:transparent;color:#B5541C;font-weight:800;font-size:15px}
  .opciones button.si{background:#B5541C;color:#fff}
  .nota{color:#7A6650;font-size:13px;margin-top:10px}
  .acciones{display:flex;gap:10px;margin-top:16px}
  .acciones button{flex:1;border:none;border-radius:14px;padding:15px;font-weight:800;font-size:16px}
  .gris{background:#FFFFFF;color:#3B2A1A;border:1.5px solid #E3D5BE !important}
</style>
</head>

  var nav = document.getElementById('categorias');
  var controles = document.querySelector('.controles');
  function normalizar(t) { return (t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
  function filtrar() {
    var texto = normalizar(buscador.value.trim());
    var conPlatos = {};
    var alguno = false;
    document.querySelectorAll('.plato').forEach(function (p) {
      var cat = p.getAttribute('data-cat');
      var ver = texto ? normalizar(p.querySelector('.info').textContent).indexOf(texto) >= 0 : (!nav || Number(cat) === actual);
      p.classList.toggle('oculto', !ver);
      if (ver) { conPlatos[cat] = true; alguno = true; }
    });
    document.querySelectorAll('h2[data-cat]').forEach(function (h) { h.classList.toggle('oculto', !conPlatos[h.getAttribute('data-cat')]); });
    document.getElementById('sinresultados').classList.toggle('oculto', alguno);
    if (nav) {
      nav.classList.toggle('oculto', !!texto);
      nav.querySelectorAll('a').forEach(function (a) { a.classList.toggle('activa', Number(a.getAttribute('data-cat')) === actual); });
    }
  }
  if (nav) nav.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-cat]');
    if (!a) return;
    e.preventDefault();
    actual = Number(a.getAttribute('data-cat'));
    filtrar();
    a.scrollIntoView({ inline: 'center', block: 'nearest' });
    if (window.scrollY > controles.offsetTop) window.scrollTo({ top: controles.offsetTop - 4, behavior: 'smooth' });
  });
  buscador.addEventListener('input', filtrar);

  pintarCant();
  filtrar();
})();
</script></body>
</html>
